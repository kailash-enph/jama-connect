version: "3.9"

# ── Jama Connect LAN Cache Server ────────────────────────────────────────────
#
# Two services share a single data volume:
#
#   api    — FastAPI (cache_server.py) on port 8867 (internal only).
#            Handles admin UI, sync, image upload, config, browser-script gen.
#            Spawns generate_caches.py as a subprocess for full syncs.
#
#   nginx  — Serves .db.gz / index.json / index.html to LAN clients on port
#            8866, with range-request support for large files.
#            Proxies /admin/* and /api/* requests to the api container.
#
# Quick start:
#   cp .env.example .env  # fill in credentials
#   docker compose up -d --build
#   # Then open http://localhost:8866 for the public dashboard
#   # Admin panel is embedded in the same page — click the lock icon
#
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Python API / admin server ─────────────────────────────────────────────
  api:
    build:
      context: ..                    # jama-connect/ root — needed to reach client/backend/
      dockerfile: server/Dockerfile
    image: jama-cache-api
    container_name: jama-cache-api
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - SERVE_DIR=/data              # override so generate_caches.py default is /data
    volumes:
      - ${SERVE_DIR:-./data}:/data   # persistent data (DBs, index.json, config)
      - ./.env:/app/.env:ro          # also mount as file (subprocess reads it directly)
    expose:
      - "8867"
    restart: unless-stopped

  # ── nginx — static file server + API proxy ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: jama-cache-server
    ports:
      - "${SERVE_PORT:-8866}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${SERVE_DIR:-./data}:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/index.json"]
      interval: 30s
      timeout: 5s
      retries: 3
