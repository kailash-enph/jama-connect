events {
    worker_connections 256;
}

http {
    # Upstream — FastAPI admin/sync container
    upstream api {
        server api:8867;
        keepalive 8;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;

        # Allow directory listing so LAN clients can discover files
        autoindex on;
        autoindex_format json;

        # NOTE: CORS headers are NOT set globally here.
        # Static-file locations set them below; proxied locations inherit
        # the ACAO headers that FastAPI already sets — no duplicates.

        # ── SSE: live sync log (needs long timeout + streaming) ─────────────
        location /admin/sync/events {
            proxy_pass         http://api;
            proxy_set_header   Host $http_host;   # preserve port (e.g. localhost:8866)
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Cookie $http_cookie;
            proxy_http_version 1.1;
            proxy_set_header   Connection '';     # keep-alive to upstream
            proxy_cache        off;
            proxy_buffering    off;               # flush SSE chunks immediately
            proxy_read_timeout 3600s;             # allow long-lived streams
            chunked_transfer_encoding on;
        }

        # ── Admin & API endpoints — proxy to FastAPI ─────────────────────────
        location ~ ^/(admin|api)/ {
            proxy_pass         http://api;
            proxy_set_header   Host $http_host;   # preserve port (e.g. localhost:8866)
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Cookie $http_cookie;
            proxy_http_version 1.1;
            proxy_set_header   Connection '';
            proxy_read_timeout 120s;
            client_max_body_size 512m;            # allow large image-sync batches
        }

        # ── Static: index.json ───────────────────────────────────────────────
        location /index.json {
            add_header Content-Type                  "application/json; charset=utf-8";
            add_header Access-Control-Allow-Origin   "*";
            add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS";
            add_header Cache-Control                 "no-cache";
        }

        # ── Static: compressed SQLite databases ──────────────────────────────
        location ~ \.db\.gz$ {
            add_header Content-Type                  "application/octet-stream";
            add_header Content-Encoding              "identity";  # don't auto-decompress
            add_header Accept-Ranges                 "bytes";     # range requests for large files
            add_header Access-Control-Allow-Origin   "*";
            add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers  "Range";
        }

        # ── Fallback: try static file, then 404 ──────────────────────────────
        location / {
            add_header Access-Control-Allow-Origin   "*";
            add_header Cache-Control                 "no-cache";
            try_files $uri $uri/ =404;
        }
    }
}
