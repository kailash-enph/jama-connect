[project]
name = "jama-connect"
version = "0.5.3"
description = "Jama Connect — Unified MCP backend, REST API, viewer, and VS Code extension"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.6.0,<2",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "keyring>=25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jama_mcp_v2", "src/jama_editor"]

[project.scripts]
jama-connect = "jama_mcp_v2.server:main"
jama-rest = "jama_mcp_v2.server:run_rest"
jama-editor = "jama_editor.editor_server:run_editor"
jama-post-install = "jama_mcp_v2.post_install:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
